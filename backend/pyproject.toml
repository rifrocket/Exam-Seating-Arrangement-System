[project]
name = "exam-seating-backend"
version = "0.1.0"
description = "Backend for the Exam Seating Arrangement System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "reportlab>=4.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pypdf>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Pyflakes (F) + the pycodestyle subset Ruff itself defaults to (E4/E7/E9),
# plus isort (I) since import ordering is cheap to enforce automatically.
# Deliberately not a broad/opinionated rule set (no pydocstyle, no
# annotations-coverage rules, etc.) — this project doesn't need one yet.
select = ["E4", "E7", "E9", "F", "I"]
